# The spec's starting defaults (docs/spec-v1.md A7, "Starting defaults"), to be revised by the calibration run
# (ticket 26) and then frozen into the main Run. Every setting is listed; see sevenwd/config.py for what each means.
encoding_version: 1
seed: 0
generations: null          # keep going until stopped
init: null                 # or another Run's checkpoint, e.g. runs/warm/net/latest.pt
init_from: null            # or another Run's directory: continue from it (checkpoint + window; see config.py)
dropped_inputs: []         # Encoding input blocks the network never sees, e.g. [derived] (see config.py)

network:
  width: 256
  blocks: 4

selfplay:
  games: 2000              # per Generation; then sized to ~1 desktop-hour
  simulations: 64
  mode: gumbel             # or classic (debug scaffolding)
  search: ""               # extra neural: settings, e.g. "m=16,cvisit=50"
  promo_rate: 1.0
  device: cpu
  threads: 4
  parallel: null           # games at a time (default 32 per core)
  workers: null            # inference threads (default 1 per 4 cores, at most 4)

training:
  window_positions: 1000000
  reuse: 2.0               # each new position is seen ~2x on average
  batch_size: 1024
  learning_rate: 0.001
  weight_decay: 0.0001
  device: auto             # CUDA when available
  checkpoint_minutes: 5
  min_steps: 1

matches:
  pairs: 200               # 400 games
  simulations: 800
  mode: gumbel
  search: ""
  device: cpu
  threads: 4
  parallel: null           # game threads (default: every core)
  promo: null              # base-only (headline Elo)
  anchor: mcts             # the Anchor, Elo 1512
  anchor_elo: null         # only needed when the anchor isn't a Ladder rung
  anchor_every: 5
  generation0_opponent: random
  reference: null          # a stronger fixed opponent than the Anchor, played on the Anchor's Generations
  reference_elo: null      # only needed when the reference isn't a Ladder rung
  reference_pairs: null    # default: pairs

stop:                      # the Run stops itself on the first of these (null switches one off)
  cap_hours: 300           # desktop-hours of training
  plateau_generations: 20  # Anchor (or reference) Elo hasn't risen by more than its error bar over the last 20 Generations
  science_min_share: 0.01  # warm-start trigger: science wins under 1% of Self-Play games ...
  science_from: 6          # ... over Generations 6-10
  science_to: 10
  progress_by: 20          # warm-start trigger: no Anchor Elo progress by Generation 20
