[project]
name = "sevenwd"
version = "0.1.0"
description = "Training side of the 7 Wonders Duel AI: trains the network and exports ONNX."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sevenwd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
